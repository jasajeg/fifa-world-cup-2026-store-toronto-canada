<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 Official Merch Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>World Cup 2026 Store</h1>
            <div class="controls">
                <div class="controls">
                <a href="about.html" style="background-color: var(--primary-color); color: white; padding: 10px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; display: flex; align-items: center;">👋 Meet the Developer</a>
                
                <input type="text" id="search-bar" placeholder="Search team or gear...">
                
                <select id="category-filter">
                <input type="text" id="search-bar" placeholder="Search team or gear...">
                
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="jerseys">Jerseys & Kits</option>
                    <option value="equipment">Equipment</option>
                    <option value="accessories">Accessories</option>
                </select>

                <select id="sort-filter">
                    <option value="default">Sort by: Default</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <div id="loading-spinner">Loading inventory...</div>
        <div id="product-grid" class="grid-container hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
